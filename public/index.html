<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/icon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        var saved = localStorage.getItem("theme");
        var dark =
          saved === "dark" ||
          (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.setAttribute("data-theme", "dark");
        var link = document.createElement("link");
        link.rel = "preload";
        link.as = "image";
        link.type = "image/webp";
        link.href =
          "%PUBLIC_URL%/" +
          (dark ? "profileImage.webp" : "light_theme_profile.webp");
        link.setAttribute("fetchpriority", "high");
        document.head.appendChild(link);
      })();
    </script>
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ffffff"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0a0f1c"
    />
    <meta
      name="description"
      content="Dariusz Podczasik — Software Engineer. AI-directed engineering, React, Next.js, TypeScript — production SaaS and modern web applications."
    />
    <meta property="og:title" content="Dariusz Podczasik — Software Engineer" />
    <meta
      property="og:description"
      content="AI-directed engineering and modern web applications — Trim, Ireland."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://boostertech.github.io/Software_Engineer_Portfolio/"
    />
    <meta
      property="og:image"
      content="https://boostertech.github.io/Software_Engineer_Portfolio/social_preview.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Let's bring visions to life — digital eye and neon React atom on dark tech backdrop"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Dariusz Podczasik — Software Engineer"
    />
    <meta
      name="twitter:description"
      content="AI-directed engineering and modern web applications — Trim, Ireland."
    />
    <meta
      name="twitter:image"
      content="https://boostertech.github.io/Software_Engineer_Portfolio/social_preview.jpg"
    />
    <link
      rel="canonical"
      href="https://boostertech.github.io/Software_Engineer_Portfolio/"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Dariusz Podczasik Portfolio</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
